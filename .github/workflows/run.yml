name: Duydun mu otomasyon

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sadece deneme (Instagram'a gönderme)"
        default: "false"
      manual:
        description: "Elle paylaşım klasörü (ör. manual/2026-11-14-kizkulesi)"
        default: ""

permissions:
  contents: write

concurrency:
  group: duydunmu
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Botu çalıştır
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MANUAL: ${{ github.event.inputs.manual }}
        run: |
          if [ "$MANUAL" = "probe" ]; then python -m bot.probe; elif [ -n "$MANUAL" ]; then python -m bot.manual "$MANUAL"; else python -m bot.main; fi
      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "duydunmu-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/state.json manual/*/PAYLASILDI 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "durum güncellendi"
            git pull --rebase -q -X ours || true
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kartlar
          path: out/
          if-no-files-found: ignore
          retention-days: 7
