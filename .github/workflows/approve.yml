name: Duydun mu onay

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: duydunmu-approve
  cancel-in-progress: false

jobs:
  approve:
    if: github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Onayı işle
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: python -m bot.approve ${{ github.event.issue.number }}
      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "duydunmu-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A state pending
          if ! git diff --cached --quiet; then git commit -m "onay işlendi"; git pull --rebase -q -X ours || true; git push; fi
