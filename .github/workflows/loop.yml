name: Duydun mu radar (sürekli)

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */2 * * *"   # bekçi: döngü durmuşsa yeniden başlatır

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  watchdog:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Döngü çalışıyor mu?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          running=$(gh run list -R "$GITHUB_REPOSITORY" -w loop.yml --json status,event -q '[.[]|select(.event=="workflow_dispatch" and (.status=="in_progress" or .status=="queued" or .status=="pending"))]|length')
          echo "çalışan döngü: $running"
          if [ "$running" = "0" ]; then gh workflow run loop.yml -R "$GITHUB_REPOSITORY"; echo "yeniden başlatıldı"; fi

  loop:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: duydunmu-loop
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium && sudo apt-get install -y -qq ffmpeg
      - name: Sürekli tarama
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m bot.loop
